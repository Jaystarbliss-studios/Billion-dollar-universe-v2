<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile - Billion Dollar Universe</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Crimson+Pro:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0E0E0E;
            --bg-secondary: #111111;
            --text-primary: #F5F5F5;
            --text-secondary: #B8B8B8;
            --accent-gold: #C6A75E;
            --accent-gold-hover: #D4B96E;
            --divider: rgba(255, 255, 255, 0.08);
            --error-red: #EF4444;
            --success-green: #10B981;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 48px;
            display: flex;
            justify-content: center;
            text-align: center;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 18px;
            text-align: left;
            max-width: 680px;
        }

        .page-logo {
            width: 60px;
            height: auto;
        }

        .header-text h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .header-text p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .form-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--divider);
            border-radius: 12px;
            padding: 48px;
        }

        .form-section {
            margin-bottom: 40px;
        }

        .form-section:last-of-type {
            margin-bottom: 0;
        }

        .section-title {
            font-family: 'Crimson Pro', serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--accent-gold);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group label .required {
            color: var(--error-red);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-primary);
            border: 1px solid var(--divider);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 16px;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        /* ── EXACT SAME availability-check classes as brand onboarding ── */
        .availability-check {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 14px;
        }

        .availability-check.checking {
            color: var(--text-secondary);
        }

        .availability-check.available {
            color: var(--success-green);
        }

        .availability-check.unavailable {
            color: var(--error-red);
        }

        .helper-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.6;
        }

        .form-group input:invalid:not(:placeholder-shown) {
            border-color: var(--error-red);
        }

        .form-group input:valid:not(:placeholder-shown) {
            border-color: rgba(16, 185, 129, 0.3);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }

        .checkbox-label:hover {
            background-color: rgba(198, 167, 94, 0.1);
        }

        .checkbox-label input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--accent-gold);
            color: var(--bg-primary);
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 32px;
        }

        .submit-btn:hover:not(:disabled) {
            background-color: var(--accent-gold-hover);
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 640px) {
            .form-card { padding: 32px 24px; }
            .header h1 { font-size: 32px; }
            .checkbox-group { grid-template-columns: 1fr; }
            .header-top { flex-direction: column; }
            .page-logo { width: 48px; }
        }
    </style>
</head>

    <script>
        // ── AUTH: block if not logged in OR already has a user account ──
        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            const userDoc = await firebase.firestore().collection('users').doc(user.uid).get();
            if (userDoc.exists) {
                window.location.href = 'user-dashboard.html';
                return;
            }
            // Pre-fill name from Google account
            const nameInput = document.getElementById('fullName');
            if (user.displayName && !nameInput.value) {
                nameInput.value = user.displayName;
                validateForm();
            }
        });

        // ── ELEMENTS ──
        const usernameInput        = document.getElementById('username');
        const usernameAvailability = document.getElementById('usernameAvailability');
        const submitBtn            = document.getElementById('submitBtn');

        // Start as false — button stays locked until check passes
        usernameInput.dataset.available = 'false';

        // Username validation and availability check
        let usernameTimeout;

        usernameInput.addEventListener('input', async (e) => {
            const username = e.target.value.toLowerCase();
            usernameInput.value = username; // Force lowercase

            clearTimeout(usernameTimeout);

            // Check for invalid characters
            const validPattern = /^[a-z0-9_]*$/;
            if (username.length > 0 && !validPattern.test(username)) {
                usernameAvailability.textContent = '✗ Only lowercase letters, numbers, and underscores allowed';
                usernameAvailability.className = 'availability-check unavailable';
                usernameInput.dataset.available = 'false';
                validateForm();
                return;
            }

            if (username.length < 3) {
                usernameAvailability.textContent = '';
                usernameAvailability.className = 'availability-check';
                usernameInput.dataset.available = 'true';
                validateForm();
                return;
            }

            usernameAvailability.textContent = 'Checking availability...';
            usernameAvailability.className = 'availability-check checking';

            usernameTimeout = setTimeout(async () => {
                try {
                    if (!firebase.firestore) {
                        throw new Error('Firestore not initialized');
                    }

                    const [usersSnap, brandsSnap] = await Promise.all([
                        firebase.firestore().collection('users').where('username', '==', username).limit(1).get(),
                        firebase.firestore().collection('brands').where('username', '==', username).limit(1).get()
                    ]);

                    if (usersSnap.empty && brandsSnap.empty) {
                        usernameAvailability.textContent = '✓ Username available';
                        usernameAvailability.className = 'availability-check available';
                        usernameInput.dataset.available = 'true';
                    } else {
                        usernameAvailability.textContent = '✗ Username already taken';
                        usernameAvailability.className = 'availability-check unavailable';
                        usernameInput.dataset.available = 'false';
                    }
                } catch (error) {
                    console.error('Error checking username:', error);
                    usernameAvailability.textContent = '⚠ Unable to verify - will check on submit';
                    usernameAvailability.className = 'availability-check checking';
                    usernameInput.dataset.available = 'true';
                }
                validateForm();
            }, 500);
        });


        // ── FORM VALIDATION ──
        function validateForm() {
            const form = document.getElementById('onboardingForm');
            const submitBtn = document.getElementById('submitBtn');

            const isFormValid = form.checkValidity();
            const isUsernameAvailable = usernameInput.dataset.available === 'true';

            const invalidFields = [];
            form.querySelectorAll('[required]').forEach(field => {
                if (!field.checkValidity()) {
                    invalidFields.push({ id: field.id, validationMessage: field.validationMessage });
                }
            });

            if (invalidFields.length > 0) {
                console.log('Form has validation errors:', invalidFields);
            }

            submitBtn.disabled = !(isFormValid && isUsernameAvailable);

            if (!isFormValid && invalidFields.length > 0) {
                submitBtn.textContent = `Complete all required fields (${invalidFields.length} missing)`;
            } else if (!isUsernameAvailable) {
                submitBtn.textContent = 'Fix username to continue';
            } else {
                submitBtn.textContent = 'Complete Setup';
            }
        }

        // Re-validate on every field change
        document.querySelectorAll('input[required], select[required]').forEach(field => {
            field.addEventListener('input', validateForm);
            field.addEventListener('change', validateForm);
        });

        // ── SUBMIT ──
        document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating profile...';

            const user     = firebase.auth().currentUser;
            const username = usernameInput.value.toLowerCase();

            try {
                // Final race-condition check on both collections
                const [usersSnap, brandsSnap] = await Promise.all([
                    firebase.firestore().collection('users').where('username', '==', username).limit(1).get(),
                    firebase.firestore().collection('brands').where('username', '==', username).limit(1).get()
                ]);

                if (!usersSnap.empty || !brandsSnap.empty) {
                    usernameAvailability.textContent = '✗ Username just taken — please choose another';
                    usernameAvailability.className = 'availability-check unavailable';
                    usernameInput.dataset.available = 'false';
                    validateForm();
                    return;
                }

                // ✅ FIX: 'role' and 'createdAt' are required by the Firestore security rule
                const userData = {
                    userId:          user.uid,
                    fullName:        document.getElementById('fullName').value.trim(),
                    username,
                    email:           user.email,
                    photoURL:        user.photoURL || '',
                    country:         document.getElementById('country').value,
                    interests:       Array.from(document.querySelectorAll('input[name="interests"]:checked')).map(cb => cb.value),
                    role:            'user',  // ✅ REQUIRED by security rule
                    coins:           0,
                    totalClicks:     0,
                    engagementScore: 0,
                    createdAt:       firebase.firestore.FieldValue.serverTimestamp()
                };

                await firebase.firestore().collection('users').doc(user.uid).set(userData);
                window.location.href = 'user-dashboard.html';

            } catch (error) {
                console.error('Error creating profile:', error);
                alert('Error: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Complete Setup';
            }
        });
    </script>

    <script>
        // ── PRIORITY COUNTRIES + AUTO-DETECT ──
        document.addEventListener('DOMContentLoaded', () => {
            const countrySelect = document.getElementById('country');

            const priorityCodes = ['US', 'NG', 'GB', 'CA', 'AU'];

            const separator = document.createElement('option');
            separator.disabled = true;
            separator.innerText = '──────────';

            if (countrySelect.options.length > 1) {
                countrySelect.insertBefore(separator, countrySelect.options[1]);
            }

            [...priorityCodes].reverse().forEach(code => {
                const option = countrySelect.querySelector(`option[value="${code}"]`);
                if (option) {
                    countrySelect.insertBefore(option, countrySelect.options[1]);
                }
            });

            // Auto-detect country via IP
            fetch('https://ipapi.co/json/')
                .then(response => response.json())
                .then(data => {
                    const opt = countrySelect.querySelector(`option[value="${data.country}"]`);
                    if (opt) {
                        countrySelect.value = data.country;
                        validateForm();
                    }
                })
                .catch(() => {});
        });
    </script>
